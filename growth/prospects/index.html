<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Crease — Brooklyn canvass</title>
<!-- Without these the tab shows Safari's fallback letter — a "U" taken from
     usecreaseapp.com, which is neither the product's name nor its mark.
     Relative hrefs: this is served from /prospects/, not the site root. -->
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- Added to the home screen it is a street tool, so it gets a short name and
     the shop-floor colour behind the status bar rather than white. -->
<meta name="apple-mobile-web-app-title" content="Canvass" />
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
<style>
  /* Street tool: used one-handed on a phone between shop doors. Big targets,
     the working state visible without a tap, nothing precious. */
  :root {
    --bg: #f6f6f4; --surface: #fff; --border: #e2e0da; --text: #1c1b18;
    --muted: #6b6862; --accent: #1f6f5c; --accent-fg: #fff;
    --warn-bg: #fdf3e2; --warn-fg: #8a5a12;
    --danger-bg: #fdeceb; --danger-fg: #a32b22;
    --live-bg: #e8f2ef; --live-fg: #1f6f5c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --surface: #1f1f24; --border: #33333b; --text: #f0efec;
      --muted: #9d9a94; --accent: #3fa587; --accent-fg: #0c1512;
      --warn-bg: #3a2e18; --warn-fg: #f0c274;
      --danger-bg: #3b1f1d; --danger-fg: #f19a92;
      --live-bg: #16302a; --live-fg: #6fd0b4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  .shell { max-width: 720px; margin: 0 auto; padding: 12px 12px 80px; }
  h1 { font-size: 18px; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); padding: 16px; }
  button, .btn { font: inherit; font-weight: 600; min-height: 44px;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; min-height: 44px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); }
  textarea { min-height: 72px; resize: vertical; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 0 0 4px; }
  .field { margin-bottom: 12px; }
  .notice { border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .notice.danger { background: var(--danger-bg); color: var(--danger-fg); }

  header.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0 10px; }
  header.top .row-actions { display: flex; gap: 8px; }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .counts { font-variant-numeric: tabular-nums; }

  /* The split the pitch depends on: dry cleaner vs laundromat is a mode,
     not a search term, so it gets the biggest control on the page. */
  .seg { display: grid; grid-auto-flow: column; gap: 0; border: 1px solid var(--border);
         border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: none; border-radius: 0; min-height: 42px; padding: 8px 6px;
                font-size: 14px; background: transparent; }
  .seg button.on { background: var(--accent); color: var(--accent-fg); }
  .filters { display: grid; gap: 8px; margin-bottom: 12px; }
  .filters .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  /* Three visit-filter buttons don't share a row with search on a phone. */
  @media (max-width: 520px) { .filters .row2 { grid-template-columns: 1fr; } }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
            padding: 0 12px; white-space: nowrap; }
  .toggle input { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); }

  details.hood { background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--radius); margin-bottom: 10px; }
  details.hood summary { display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 13px 14px; cursor: pointer; list-style: none; font-weight: 700;
    -webkit-tap-highlight-color: transparent; }
  details.hood summary::-webkit-details-marker { display: none; }
  details.hood summary .prog { color: var(--muted); font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  details.hood summary .prog.done { color: var(--live-fg); }

  .shop { border-top: 1px solid var(--border); padding: 12px 14px; display: grid;
          grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; }
  .shop.visited .name { color: var(--muted); }
  .shop input[type=checkbox] { width: 26px; height: 26px; min-height: 0; margin: 2px 0 0;
                               accent-color: var(--accent); }
  .shop .name { font-weight: 700; }
  .shop .meta { color: var(--muted); font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
  .shop .links { display: flex; gap: 6px; }
  .shop .links a { display: grid; place-items: center; width: 40px; height: 40px;
    border: 1px solid var(--border); border-radius: 8px; text-decoration: none;
    font-size: 17px; background: var(--surface); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px;
          font-weight: 700; vertical-align: 1px; margin-left: 6px; white-space: nowrap; }
  .chip.dc { background: var(--live-bg); color: var(--live-fg); }
  .chip.lm { background: var(--warn-bg); color: var(--warn-fg); }
  .chip.interested { background: var(--live-bg); color: var(--live-fg); }
  .chip.follow_up { background: var(--warn-bg); color: var(--warn-fg); }
  .chip.declined { background: var(--danger-bg); color: var(--danger-fg); }
  .chip.fs { background: var(--live-bg); color: var(--live-fg); }
  .chip.ss { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .chip.oa { background: var(--bg); color: var(--warn-fg); border: 1px solid var(--warn-fg); }
  .chip.co { background: var(--bg); color: var(--danger-fg); border: 1px solid var(--danger-fg); }
  .notes-preview { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 2px;
                   overflow-wrap: anywhere; }

  .editor { grid-column: 1 / -1; display: grid; gap: 8px; padding-top: 4px; }
  .editor .seg button { font-size: 13px; }
  .savestate { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; }
  .savestate.ok { color: var(--live-fg); }
  .savestate.queued { color: var(--warn-fg); }
  .empty { color: var(--muted); text-align: center; padding: 32px 12px; }

  /* The unsynced-work bar. Loud on purpose: an edit that only lives in this
     phone's localStorage is work nobody else can see yet. */
  .notice.pend { background: var(--warn-bg); color: var(--warn-fg); }
  .syncbar form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 8px; }
  @media (max-width: 520px) { .syncbar form { grid-template-columns: 1fr; } }
  .syncbar input { min-height: 40px; }
  .syncbar button { min-height: 40px; }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<!-- Vendored, not esm.sh. This page is served from portal.usecreaseapp.com,
     the same origin as the cleaner portal, whose Supabase session cookies are
     readable from script — so an unpinned third-party module here ("@2", newest
     build at load time) is a standing handover of those sessions to whoever
     publishes it next. Refresh the copy deliberately, from node_modules. -->
<script src="supabase.js"></script>
<script type="module">
const { createClient } = window.supabase;

const db = createClient('__SUPABASE_URL__', '__SUPABASE_ANON_KEY__', {
  auth: {
    // Google returns here with ?code=; PKCE means the verifier is in this
    // browser's storage and the exchange happens client-side, which is the
    // only option for a page nginx serves off disk with no server behind it.
    flowType: 'pkce',
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true,
  },
});
const app = document.getElementById('app');

const KIND_LABEL = { dry_cleaner: 'Dry cleaner', laundromat: 'Laundromat' };
const OUTCOMES = [['interested', 'Interested'], ['follow_up', 'Follow up'], ['declined', 'Declined']];

let rows = [];
const ui = {
  kind: localStorage.canvassKind ?? 'dry_cleaner',
  // Which market's list is on screen. Only ever offered when the table holds
  // more than one — a segment with a single button is furniture.
  borough: localStorage.canvassBorough ?? null,
  q: '',
  // 'all' | 'unvisited' | 'visited'; migrates the old hide-visited checkbox pref.
  visit: localStorage.canvassVisit ?? (localStorage.canvassHide === '1' ? 'unvisited' : 'all'),
  fullOnly: localStorage.canvassFull === '1',
  open: new Set(JSON.parse(localStorage.canvassOpen ?? '[]')),
  expanded: null,           // id of the row whose editor is showing
};
const persistUi = () => {
  localStorage.canvassKind = ui.kind;
  if (ui.borough) localStorage.canvassBorough = ui.borough;
  localStorage.canvassVisit = ui.visit;
  localStorage.canvassFull = ui.fullOnly ? '1' : '0';
  localStorage.canvassOpen = JSON.stringify([...ui.open]);
};

const esc = (s) => (s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------------------------------------------------------------------
 * Autosave is a two-step: every edit lands in a durable local queue first, and
 * the network write is a retry against that queue. The old one-shot update
 * meant any failure — and the common one is the access token expiring while
 * the page sits open between shops, after which supabase-js sends the anon key
 * and Postgres answers "permission denied for table prospects" (42501) — threw
 * away what was typed at the counter. Nothing is lost now: the queue survives a
 * reload, a dead cell signal, and a signed-out session, and drains when the
 * session comes back.
 * ------------------------------------------------------------------------ */
const PENDING_KEY = 'canvassPending';
const readPending = () => { try { return JSON.parse(localStorage[PENDING_KEY] ?? '{}'); } catch { return {}; } };
let pending = readPending();
let authLost = false;
/* Has a sync attempt actually failed, or are we offline?
 *
 * NOT "is anything queued". Every keystroke stages an edit and the push is on a
 * 700ms debounce, so a queue length above zero is the normal state of typing a
 * note — warning about it meant the bar sat on screen the entire time someone
 * was writing, which trains people to ignore it. The bar now speaks only when
 * the work is genuinely not reaching the server. */
let syncBlocked = false;
const pendingCount = () => Object.keys(pending).length;
const persistPending = () => { localStorage[PENDING_KEY] = JSON.stringify(pending); };

async function main() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return renderLogin();
  authLost = false;
  localStorage.canvassEmail = session.user.email ?? '';
  const { data, error } = await db.from('prospects').select('*').limit(1000);
  if (error) return renderLogin(`Couldn't load the list: ${error.message}`);
  if (!data.length) return renderLogin('Signed in, but this account cannot see the canvass list.');
  rows = data;
  // Pin the market before anything renders. Left null with two boroughs on the
  // table, the segment would show with no button lit and the list would mix
  // both — the exact confusion the segment exists to prevent. A stored
  // preference for a market that is no longer in the data is not one.
  const markets = boroughs();
  ui.borough = markets.length > 1
    ? (markets.includes(ui.borough) ? ui.borough : markets[0])
    : null;
  // Unsynced local edits outrank the server copy: they're newer by definition,
  // and they're what the person believes they recorded.
  for (const r of rows) if (pending[r.id]) Object.assign(r, pending[r.id]);
  render();
  flush();
}

function renderLogin(err) {
  app.innerHTML = `
    <h1>Crease — Brooklyn canvass</h1>
    <p class="sub"><a href="/">← Portal</a> · <a href="/prospects/roadmap.html">Roadmap</a></p>
    <p class="sub">Sign in to work the list.</p>
    ${err ? `<div class="notice danger">${esc(err)}</div>` : ''}
    <div class="card">
      <button class="primary" id="google" style="width:100%">Continue with Google</button>
      <p class="sub" style="margin:12px 0 0">
        This list is scoped to one account by the database itself, so signing in
        with anything else shows an empty page rather than somebody's notes.
      </p>
    </div>`;
  // One tap on a phone in the street, which is where this tool is used. The
  // password form it replaced meant typing a generated password into a
  // keyboard while standing outside a laundromat.
  document.getElementById('google').onclick = async () => {
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      // Back to this exact page, not the site root: the canvasser was in the
      // middle of a list and should land back on it.
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) renderLogin(error.message);
  };
}

/* The list stays on screen when the session dies — the re-auth is a bar above
 * it, not a trip back to the login page. Losing the working view mid-canvass
 * (which shop was open, what was typed) is its own kind of data loss.
 *
 * Built once per render and afterwards only *updated* — text swapped, pieces
 * hidden. Every keystroke in a note updates this bar, so an innerHTML rewrite
 * here would tear out whatever the canvasser was interacting with at exactly
 * the wrong moment. */
function syncBarHTML() {
  return `
    <div class="notice" id="syncnotice" hidden>
      <span id="syncmsg"></span>
      <form id="resync" hidden>
        <button class="primary" type="submit">Sign in with Google &amp; sync</button>
      </form>
    </div>`;
}

function renderSyncBar() {
  const notice = document.getElementById('syncnotice');
  if (!notice) return;
  const n = pendingCount();
  const offline = !navigator.onLine;
  // Only three things are worth interrupting someone mid-canvass for, and all
  // three mean the same thing: this work is not on the server yet.
  const stuck = n > 0 && (authLost || syncBlocked || offline);
  notice.hidden = !stuck;
  notice.className = `notice ${authLost ? 'danger' : 'pend'}`;
  document.getElementById('syncmsg').textContent = !stuck ? '' : authLost
    ? `Signed out — ${n} edit${n === 1 ? '' : 's'} held on this phone, nothing lost. Sign in to sync.`
    : offline
    ? `Offline — ${n} edit${n === 1 ? '' : 's'} held on this phone. They'll sync when you're back on.`
    : `${n} edit${n === 1 ? '' : 's'} couldn't reach the server yet. Still held on this phone.`;
  document.getElementById('resync').hidden = !authLost;
}

function wireSyncBar() {
  const form = document.getElementById('resync');
  if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    // Held edits survive the round trip: they live in localStorage and are
    // flushed on the way back in, which is the whole reason this bar exists
    // instead of a redirect to the login page.
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) alert(error.message);
  };
}

// Rows seeded before the borough column existed are Brooklyn; the column's
// default says so too, but the page must not depend on a backfill having run.
const boroughOf = (r) => r.borough ?? 'Brooklyn';
const boroughs = () => [...new Set(rows.map(boroughOf))].sort();

// The market filter is the outermost one, and search does NOT escape it:
// unlike the kind tabs, a hit in another borough is not the shop in front of
// you, it is a shop thirty minutes away with a similar name.
const inMarket = (r) => !ui.borough || boroughOf(r) === ui.borough;

// A typed search spans every kind: mid-canvass the question is "do we have
// this shop at all", and a tab-scoped miss reads as a missing row.
const visible = () => rows.filter((r) =>
  inMarket(r) &&
  (ui.q || ui.kind === 'all' || r.kind === ui.kind) &&
  (!(ui.fullOnly && ui.kind === 'laundromat') || r.full_service === true) &&
  (ui.q || ui.visit === 'all' || (ui.visit === 'visited') === !!r.visited) &&
  (!ui.q || (r.name + ' ' + (r.address ?? '') + ' ' + r.neighborhood).toLowerCase().includes(ui.q)));

function render() {
  const market = rows.filter(inMarket);
  const inKind = market.filter((r) => ui.kind === 'all' || r.kind === ui.kind);
  const list = visible();

  const hoods = new Map();
  for (const r of list) {
    if (!hoods.has(r.neighborhood)) hoods.set(r.neighborhood, []);
    hoods.get(r.neighborhood).push(r);
  }
  const sorted = [...hoods.entries()].sort((a, b) => b[1].length - a[1].length);

  app.innerHTML = `
    <header class="top">
      <div>
        <h1>${esc(ui.borough ?? boroughs()[0] ?? 'Brooklyn')} canvass</h1>
        <div class="sub counts">${inKind.filter((r) => r.visited).length} of ${inKind.length} visited</div>
      </div>
      <div class="row-actions">
        <a class="btn" href="roadmap.html">Roadmap</a>
        <button id="signout">Sign out</button>
      </div>
    </header>
    <div class="syncbar" id="syncbar">${syncBarHTML()}</div>
    <div class="filters">
      ${boroughs().length > 1 ? `<div class="seg" id="boroseg">
        ${boroughs().map((b) => `<button data-b="${esc(b)}" ${ui.borough === b ? 'class="on"' : ''}>${esc(b)}</button>`).join('')}
      </div>` : ''}
      <div class="seg" id="kindseg">
        <button data-k="dry_cleaner" ${ui.kind === 'dry_cleaner' ? 'class="on"' : ''}>Dry cleaners · ${market.filter((r) => r.kind === 'dry_cleaner').length}</button>
        <button data-k="laundromat" ${ui.kind === 'laundromat' ? 'class="on"' : ''}>Laundromats · ${market.filter((r) => r.kind === 'laundromat').length}</button>
        <button data-k="all" ${ui.kind === 'all' ? 'class="on"' : ''}>All</button>
      </div>
      <div class="row2">
        <input id="q" type="search" placeholder="Search name, street, neighborhood" value="${esc(ui.q)}" />
        <div class="seg" id="visitseg">
          <button data-v="all" ${ui.visit === 'all' ? 'class="on"' : ''}>All</button>
          <button data-v="unvisited" ${ui.visit === 'unvisited' ? 'class="on"' : ''}>To visit</button>
          <button data-v="visited" ${ui.visit === 'visited' ? 'class="on"' : ''}>Visited</button>
        </div>
      </div>
      ${ui.kind === 'laundromat' ? `<label class="toggle" style="padding:0 2px">
        <input id="fullonly" type="checkbox" ${ui.fullOnly ? 'checked' : ''} />
        Full service only · ${market.filter((r) => r.kind === 'laundromat' && r.full_service === true).length} confirmed
      </label>` : ''}
    </div>
    <div id="list">
      ${sorted.length === 0 ? `<div class="empty">Nothing matches.</div>` : sorted.map(([hood, shops]) => {
        const v = shops.filter((s) => s.visited).length;
        return `
        <details class="hood" data-hood="${esc(hood)}" ${ui.open.has(hood) || ui.q ? 'open' : ''}>
          <summary><span>${esc(hood)}</span>
            <span class="prog ${v === shops.length ? 'done' : ''}">${v}/${shops.length}</span></summary>
          ${shops.map(shopRow).join('')}
        </details>`;
      }).join('')}
    </div>`;

  wire();
}

function shopRow(r) {
  // ll + q drops a pin at the exact coords labeled with the shop name; a bare
  // q search near ll could resolve to a different storefront on the block.
  const maps = `https://maps.apple.com/?ll=${r.lat},${r.lng}&q=${encodeURIComponent(r.name)}`;
  const expanded = ui.expanded === r.id;
  return `
  <div class="shop ${r.visited ? 'visited' : ''}" data-id="${r.id}">
    <input type="checkbox" data-visit ${r.visited ? 'checked' : ''} aria-label="Visited" />
    <div data-expand>
      <div class="name">${esc(r.name)}
        <span class="chip ${r.kind === 'dry_cleaner' ? 'dc' : 'lm'}">${KIND_LABEL[r.kind]}</span>
        ${r.outcome ? `<span class="chip ${r.outcome}">${OUTCOMES.find(([k]) => k === r.outcome)[1]}</span>` : ''}
        ${r.kind === 'laundromat' && r.full_service === true ? '<span class="chip fs">Full service</span>' : ''}
        ${r.kind === 'laundromat' && r.full_service === false ? '<span class="chip ss">Self-serve only</span>' : ''}
        ${r.own_app === true ? '<span class="chip oa">Own app</span>' : ''}
        ${r.cash_only === true ? '<span class="chip co">Cash only</span>' : ''}
      </div>
      <div class="meta">${esc(r.address ?? 'No address on file')}${r.zip ? ' · ' + esc(r.zip) : ''}</div>
      ${r.notes && !expanded ? `<div class="notes-preview">${esc(r.notes)}</div>` : ''}
    </div>
    <div class="links">
      ${r.phone ? `<a href="tel:${esc(r.phone)}" aria-label="Call">📞</a>` : ''}
      <a href="${maps}" target="_blank" rel="noopener" aria-label="Map">📍</a>
    </div>
    ${expanded ? `
    <div class="editor">
      <div class="seg" data-outseg>
        ${OUTCOMES.map(([k, label]) =>
          `<button data-out="${k}" ${r.outcome === k ? 'class="on"' : ''}>${label}</button>`).join('')}
      </div>
      ${r.kind === 'laundromat' ? `<div class="seg" data-fsseg>
        <button data-fs="true" ${r.full_service === true ? 'class="on"' : ''}>Full service</button>
        <button data-fs="false" ${r.full_service === false ? 'class="on"' : ''}>Self-serve only</button>
      </div>` : ''}
      <div class="seg" data-flagseg>
        <button data-oa ${r.own_app === true ? 'class="on"' : ''}>Has own app</button>
        <button data-co ${r.cash_only === true ? 'class="on"' : ''}>Cash only</button>
      </div>
      <textarea data-notes placeholder="Notes — who you spoke to, pricing, objections…">${esc(r.notes ?? '')}</textarea>
      <div class="savestate ${r._save === 'ok' ? 'ok' : ''}" data-save>${esc(saveText(r))}</div>
    </div>` : ''}
  </div>`;
}

const saveText = (r) =>
  r._save === 'saving' ? 'Saving…' :
  r._save === 'ok' ? 'Saved' :
  r._save === 'queued' ? 'Saved on this phone — will sync' :
  r._save === 'err' ? `Not saved: ${r._saveMsg ?? ''}` : '';

/**
 * The indicator lives on the row, not the DOM node: outcome taps re-render
 * the list, and a "Saved" pinned to a destroyed element is a save the person
 * at the counter never sees.
 */
function setSaveState(r, s, msg) {
  r._save = s;
  r._saveMsg = msg;
  const el = document.querySelector(`.shop[data-id="${r.id}"] [data-save]`);
  if (el) { el.className = `savestate ${s === 'ok' ? 'ok' : s === 'queued' ? 'queued' : ''}`;
            el.textContent = saveText(r); }
  if (s === 'ok') setTimeout(() => {
    if (r._save !== 'ok') return;
    r._save = null;
    const e2 = document.querySelector(`.shop[data-id="${r.id}"] [data-save]`);
    if (e2) e2.textContent = '';
  }, 2500);
}

/**
 * Record an edit. Applies it to the row on screen, writes it to the durable
 * queue, and returns — no network. Every keystroke can afford this, which is
 * the point: the note is safe before the debounce fires, not after.
 */
function stage(r, patch) {
  Object.assign(r, patch);
  pending[r.id] = { ...pending[r.id], ...patch, updated_at: new Date().toISOString() };
  persistPending();
  setSaveState(r, navigator.onLine && !authLost ? 'saving' : 'queued');
  renderSyncBar();
}

// Retryable: the session died, or the phone is between cell towers. The queue
// keeps the edit and tries again. Anything else (a constraint, a rejected
// value) will fail identically forever, so it must not wedge the queue.
const isAuthFail = (e) =>
  e.code === '42501' || e.code === 'PGRST301' || e.code === '401' ||
  /jwt|token|permission denied|not authoriz/i.test(e.message ?? '');
const isNetFail = (e) => !e.code && /fetch|network|load failed|timeout|offline/i.test(e.message ?? '');

let flushing = false, flushAgain = false;

/** Drain the queue oldest-first. Safe to call from anywhere, any number of times. */
async function flush() {
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  let hardFailed = false;
  try {
    if (!pendingCount()) return;
    // getSession refreshes an expired access token; without this the write
    // goes out under the anon key and comes back 42501.
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      authLost = true;
      syncBlocked = true;
      for (const id of Object.keys(pending)) markRow(id, 'queued');
      return;
    }
    authLost = false;

    for (const id of Object.keys(pending)) {
      const sent = { ...pending[id] };
      // select('id') so a policy refusal is visible: RLS denies an UPDATE by
      // matching no rows, not by erroring, and a silently dropped edit is the
      // failure this whole queue exists to prevent.
      const { data: hit, error } = await db.from('prospects').update(sent).eq('id', id).select('id');

      if (!error && hit && hit.length === 0) {
        delete pending[id];
        persistPending();
        hardFailed = true;
        markRow(id, 'err', 'this sign-in cannot edit the canvass list');
        continue;
      }

      if (!error) {
        // A write landed, so whatever was blocking us is over. Clearing this on
        // success (not just on an empty queue) means a run of typing that keeps
        // the queue non-empty still puts the bar away.
        syncBlocked = false;
        // Only clear what was actually sent — the person may have typed more
        // into this row while the request was in flight.
        for (const k of Object.keys(sent)) {
          if (pending[id] && pending[id][k] === sent[k]) delete pending[id][k];
        }
        if (pending[id] && !Object.keys(pending[id]).filter((k) => k !== 'updated_at').length) delete pending[id];
        persistPending();
        markRow(id, pending[id] ? 'queued' : 'ok');
        continue;
      }

      if (isAuthFail(error) || isNetFail(error)) {
        if (isAuthFail(error)) authLost = true;
        syncBlocked = true;          // now the bar has something real to say
        markRow(id, 'queued');
        break;                       // hold the rest; the same wall is in front of them
      }

      // Permanently rejected: drop it and show what the server actually holds,
      // rather than leaving a lie on screen.
      delete pending[id];
      persistPending();
      hardFailed = true;
      markRow(id, 'err', error.message);
      const { data } = await db.from('prospects').select('*').eq('id', id).maybeSingle();
      const r = rows.find((x) => x.id === id);
      if (data && r) Object.assign(r, data);
    }
  } finally {
    flushing = false;
    renderSyncBar();
    if (hardFailed) render();
    if (flushAgain) { flushAgain = false; flush(); }
  }
}

function markRow(id, state, msg) {
  const r = rows.find((x) => x.id === id);
  if (r) setSaveState(r, state, msg);
}

// Every plausible way the session or the signal comes back is a chance to drain.
db.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') { authLost = false; flush(); }
  if (event === 'SIGNED_OUT') { authLost = true; renderSyncBar(); }
});
window.addEventListener('online', () => flush());
// Going offline is itself a reason to raise the bar; nothing else fires here.
window.addEventListener('offline', () => renderSyncBar());
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(() => { if (pendingCount()) flush(); }, 20000);

function wire() {
  wireSyncBar();
  renderSyncBar();
  document.getElementById('signout').onclick = async () => {
    // Unsynced work is not the sign-out button's to throw away; warn, and keep
    // the queue either way so the next sign-in drains it.
    if (pendingCount() && !confirm(`${pendingCount()} edit(s) haven't synced yet. Sign out anyway? They'll sync next time you sign in on this phone.`)) return;
    await db.auth.signOut();
    renderLogin();
  };
  const boro = document.getElementById('boroseg');
  if (boro) boro.onclick = (e) => {
    const b = e.target.dataset?.b;
    // Neighbourhoods don't repeat across boroughs, but the open-set is keyed by
    // name alone, so a switch starts the new market collapsed rather than
    // half-open on whatever was expanded in the old one.
    if (b) { ui.borough = b; ui.open = new Set(); ui.expanded = null; persistUi(); render(); }
  };
  document.getElementById('kindseg').onclick = (e) => {
    const k = e.target.dataset?.k;
    if (k) { ui.kind = k; persistUi(); render(); }
  };
  const q = document.getElementById('q');
  q.oninput = () => { ui.q = q.value.trim().toLowerCase(); render(); refocus(q); };
  document.getElementById('visitseg').onclick = (e) => {
    const v = e.target.dataset?.v;
    if (v) { ui.visit = v; persistUi(); render(); }
  };
  const fo = document.getElementById('fullonly');
  if (fo) fo.onchange = (e) => { ui.fullOnly = e.target.checked; persistUi(); render(); };

  for (const d of document.querySelectorAll('details.hood')) {
    d.ontoggle = () => {
      if (ui.q) return; // search forces everything open; don't persist that
      d.open ? ui.open.add(d.dataset.hood) : ui.open.delete(d.dataset.hood);
      persistUi();
    };
  }

  for (const shopEl of document.querySelectorAll('.shop')) {
    const r = rows.find((x) => x.id === shopEl.dataset.id);

    shopEl.querySelector('[data-visit]').onchange = (e) => {
      // The tap sticks immediately — the queue owns getting it to the server —
      // so the box never flips back under the person's thumb.
      stage(r, {
        visited: e.target.checked,
        visited_at: e.target.checked ? new Date().toISOString() : null,
      });
      render();
      flush();
    };

    shopEl.querySelector('[data-expand]').onclick = () => {
      ui.expanded = ui.expanded === r.id ? null : r.id;
      render();
      if (ui.expanded) document.querySelector(`.shop[data-id="${r.id}"] [data-notes]`)?.focus();
    };

    shopEl.querySelector('[data-outseg]')?.addEventListener('click', (e) => {
      const k = e.target.dataset?.out;
      if (!k) return;
      // tapping the active outcome clears it — a mis-tap must be undoable
      stage(r, { outcome: r.outcome === k ? null : k });
      render();
      flush();
    });

    shopEl.querySelector('[data-fsseg]')?.addEventListener('click', (e) => {
      const v = e.target.dataset?.fs;
      if (v === undefined) return;
      const next = String(r.full_service) === v ? null : v === 'true';
      stage(r, { full_service: next });
      render();
      flush();
    });

    shopEl.querySelector('[data-flagseg]')?.addEventListener('click', (e) => {
      // Independent toggles, not a radio group: a shop can be both.
      // Each toggles true <-> unknown; the negative is just the default.
      if (e.target.dataset?.oa !== undefined) {
        stage(r, { own_app: r.own_app === true ? null : true });
      } else if (e.target.dataset?.co !== undefined) {
        stage(r, { cash_only: r.cash_only === true ? null : true });
      } else return;
      render();
      flush();
    });

    const notes = shopEl.querySelector('[data-notes]');
    if (notes) {
      let t;
      // Staged on every keystroke (durable, local, free), pushed on a debounce.
      // A phone that dies mid-sentence loses nothing.
      notes.oninput = () => {
        stage(r, { notes: notes.value || null });
        clearTimeout(t);
        t = setTimeout(flush, 700);
      };
      notes.onblur = () => { clearTimeout(t); stage(r, { notes: notes.value || null }); flush(); };
    }
  }
}

// keep typing focus through re-renders triggered by search
function refocus(q) {
  const nq = document.getElementById('q');
  nq.focus();
  nq.setSelectionRange(nq.value.length, nq.value.length);
}

main();
</script>
</body>
</html>
