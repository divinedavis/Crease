# Every push (any branch: production deploys from pricing-route-aware, which
# the old main-only trigger never saw) and every PR. The same two gates run
# locally in .githooks/pre-push; this catches pushes from anywhere the hook
# isn't installed (the droplet's growth checkout, other worktrees, --no-verify).
# The repo is public, so the minutes are free. ubuntu only — never macOS.
name: CI

on:
  push:
  pull_request:

# Least privilege by default: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned rather than a tag: a mutable tag on a public repo means the
      # action's owner (or anyone who compromises them) can change what runs
      # here after review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Typecheck every workspace, then every unit test (node + growth/
      # Python). Exactly what the pre-push hook runs.
      - name: Test
        run: scripts/test.sh

      # The process that holds the service-role, Stripe and Uber keys is
      # dispatch (+ the two packages it imports): a high advisory in its
      # runtime tree blocks. The whole tree, Next's build-time postcss
      # included, blocks only at critical.
      - name: Audit
        run: |
          npm audit --audit-level=high --omit=dev -w @crease/dispatch -w @crease/delivery -w @crease/payments
          npm audit --audit-level=critical
