# The canvass page browser tests (scripts/canvass-test/*-test.py): the real
# growth/prospects pages driven in headless Chromium against a stubbed
# Supabase. No credentials, no network beyond the runner. Path-filtered, so
# they run only when the canvass page, its tests or this file change.
# The production journey suite (scripts/e2e*.mjs) is NOT here: it runs against
# prod over an SSH tunnel with keychain secrets, which never go to GitHub.
name: canvass

on:
  push:
    paths:
      - 'growth/prospects/**'
      - 'scripts/canvass-test/**'
      - '.github/workflows/canvass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -q playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Canvass browser tests
        run: |
          s=0
          for t in scripts/canvass-test/*-test.py; do
            echo "== $t"; python "$t" || s=1
          done
          exit $s
