# Crease — cleaner portal + carrier webhook endpoint.
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc.
# A quoted heredoc writes $uri literally and nginx will 404 every route while
# `nginx -t` still passes. Verify with a real curl for 200, not just -t.
#
# The rate-limit zones this references (req_api, req_strict) are defined at
# http scope in /etc/nginx/conf.d/ratelimit.conf on the droplet, shared with
# the other sites on the box. Both key on $binary_remote_addr — never on an
# X-Forwarded-For entry, which the client controls.

server {
    listen 80;
    listen [::]:80;
    server_name crease.divinedavis.com;

    # Certbot writes challenges here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 on this droplet predates the standalone `http2 on;` directive
    # (1.25.1+). Use the listen-parameter form — the newer syntax fails
    # `nginx -t` with "unknown directive", which would take down every other
    # site on this box the next time nginx restarted.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crease.divinedavis.com;

    ssl_certificate     /etc/letsencrypt/live/crease.divinedavis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crease.divinedavis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crease.access.log site;
    error_log  /var/log/nginx/crease.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    # --- carrier webhooks -------------------------------------------------
    # Public by necessity: Uber Direct will not deliver callbacks to a private
    # host. Authentication is the HMAC on the body, which the dispatcher
    # verifies against the raw bytes — so this must never be rate-limited into
    # dropping real events, and must never be buffered in a way that alters
    # them. Signature failures are logged and rejected by the app.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # --- customer app API -------------------------------------------------
    # Public by necessity — the app runs on a phone. Authenticated by the
    # customer's own Supabase token, not by a shared secret, and every route
    # re-checks that the order belongs to the caller. A secret shipped in an
    # IPA belongs to anyone who downloads it, so there is none here.
    #
    # Rate-limited because every request here — even one with a garbage Bearer
    # token — costs an outbound auth lookup to Supabase before it can be
    # rejected. burst=40 nodelay absorbs a legitimate app foregrounding a
    # screenful of orders without throttling; a flood is shed at 20r/s.
    location /v1/me/ {
        limit_req zone=req_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- internal dispatch API -------------------------------------------
    # Guarded by a shared secret at the app layer, but there is no reason for
    # it to be reachable from the open internet at all: only the portal, which
    # runs on this same host, ever calls it.
    location /v1/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- canvassing tool (static, founder-only via Supabase RLS) ----------
    # ^~ so this prefix wins outright and the request never reaches the
    # portal proxy below. HTTP basic auth in front of it as well: the page
    # embeds the anon key and a live Supabase session, and RLS scopes it to
    # the canvasser account, but there is no reason to leave the login surface
    # itself open to the internet. The password file lives only on the box
    # (/etc/nginx/.crease-prospects), never in the repo.
    location ^~ /prospects {
        auth_basic "Crease";
        auth_basic_user_file /etc/nginx/.crease-prospects;
        alias /var/www/crease-prospects;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # --- cleaner portal ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3010;
        # Overwrite, never pass through: a caller's own X-Forwarded-Host would
        # otherwise reach Next, where it drives redirect origins and the Server
        # Action CSRF check.
        proxy_set_header X-Forwarded-Host $host;

        # The portal's auth middleware builds its /login redirect from the
        # server's own origin instead of the forwarded host, so signed-out
        # visitors were being sent to localhost:3010 — a dead end in the
        # visitor's own browser. Rewrite Location on the way out. The real fix
        # is in apps/portal/middleware.ts (derive the host from
        # x-forwarded-host); this stays as a belt-and-braces guard because a
        # rebuild on this box risks OOM-ing the four other sites it serves.
        proxy_redirect http://localhost:3010/  https://crease.divinedavis.com/;
        proxy_redirect https://localhost:3010/ https://crease.divinedavis.com/;
        proxy_redirect http://127.0.0.1:3010/  https://crease.divinedavis.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
