# Pre-TLS vhost for usecreaseapp.com (public landing page).
#
# Installed before the certificate exists so that the moment the DNS records
# resolve, certbot's webroot challenge can be served. `deploy/enable-tls.sh`
# (with CREASE_DOMAIN=usecreaseapp.com) replaces this with nginx-landing.conf
# once the cert is issued.
#
# Edit locally and scp; a quoted ssh heredoc mangles $uri into a literal and
# nginx will 404 every route while `nginx -t` still passes.

server {
    listen 80;
    listen [::]:80;
    server_name usecreaseapp.com www.usecreaseapp.com;

    access_log /var/log/nginx/usecreaseapp.access.log site;
    error_log  /var/log/nginx/usecreaseapp.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /var/www/usecreaseapp;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
