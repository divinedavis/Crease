# portal.usecreaseapp.com + api.usecreaseapp.com — the branded homes for the
# cleaner portal and the customer API / carrier webhooks.
#
# crease.divinedavis.com (nginx-crease.conf) stays installed as an alias: the
# iOS builds in the field have DISPATCH_URL baked in at compile time, so that
# vhost must keep answering until every TestFlight install is on a build that
# points at api.usecreaseapp.com.
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc
# ($uri gets written literally and every route 404s while nginx -t passes).

server {
    listen 80;
    listen [::]:80;
    server_name portal.usecreaseapp.com api.usecreaseapp.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- customer API + carrier webhooks -------------------------------------
server {
    # nginx 1.24 on this droplet predates standalone `http2 on;` — keep the
    # listen-parameter form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crease-api.access.log site;
    error_log  /var/log/nginx/crease-api.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 12m;

    # Public by necessity: carriers will not deliver callbacks to a private
    # host. Auth is the HMAC over the raw body — never rate-limit real events
    # away, never buffer in a way that alters the bytes.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # Public by necessity — the app runs on a phone. Authenticated by the
    # customer's own Supabase token; every route re-checks ownership.
    location /v1/me/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Internal dispatch API: only the portal, on this same host, ever calls it.
    location /v1/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        access_log off;
    }

    # An API host has no pages; anything else is a probe.
    location / { return 404; }
}

# --- cleaner portal -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crease-portal.access.log site;
    error_log  /var/log/nginx/crease-portal.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    # Canvassing tool (static, founder-only via Supabase RLS). ^~ so this
    # prefix wins outright and never reaches the portal proxy below.
    location ^~ /prospects {
        alias /var/www/crease-prospects;
        index index.html;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;

        # Belt-and-braces guard mirrored from nginx-crease.conf: the portal's
        # middleware now derives its origin from x-forwarded-host, but a
        # rebuild on this box risks OOM-ing the other sites it serves, so the
        # standalone server binary may predate that fix. Rewrite Location on
        # the way out.
        proxy_redirect http://localhost:3010/  https://portal.usecreaseapp.com/;
        proxy_redirect https://localhost:3010/ https://portal.usecreaseapp.com/;
        proxy_redirect http://127.0.0.1:3010/  https://portal.usecreaseapp.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
