# usecreaseapp.com — public landing page (static).
#
# The cleaner portal, customer API, and carrier webhooks all stay on
# crease.divinedavis.com (see nginx-crease.conf); this vhost serves marketing
# HTML only, so it proxies nothing.
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc.

server {
    listen 80;
    listen [::]:80;
    server_name usecreaseapp.com www.usecreaseapp.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://usecreaseapp.com$request_uri; }
}

server {
    # nginx 1.24 on this droplet predates the standalone `http2 on;` directive
    # (1.25.1+) — keep the listen-parameter form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://usecreaseapp.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/usecreaseapp.access.log site;
    error_log  /var/log/nginx/usecreaseapp.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/usecreaseapp;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
