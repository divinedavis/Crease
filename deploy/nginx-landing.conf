# usecreaseapp.com — the old customer site, now a redirect to creasenyc.com.
#
# Static marketing HTML until the site had to answer a question: "do you reach
# my street?". That answer needs the partner list and has to be recorded, so
# the vhost now proxies apps/web (Next, 127.0.0.1:3020) rather than serving
# files. /assets and /privacy.html still come off disk, because a stylesheet
# does not need a Node process.
#
# The cleaner portal, customer API, and carrier webhooks stay where they are
# (see nginx-app-domains.conf).
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc.

server {
    listen 80;
    listen [::]:80;
    server_name usecreaseapp.com www.usecreaseapp.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://usecreaseapp.com$request_uri; }
}

server {
    # nginx 1.24 on this droplet predates the standalone `http2 on;` directive
    # (1.25.1+) — keep the listen-parameter form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://usecreaseapp.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/usecreaseapp.access.log site;
    error_log  /var/log/nginx/usecreaseapp.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The site moved to creasenyc.com. Everything here redirects rather than
    # serving a second copy: two live origins for one site is two sets of
    # links, two analytics stories, and a search engine picking whichever it
    # prefers. api.usecreaseapp.com is the deliberate exception — see
    # nginx-app-domains.conf — because shipped phones cannot be redeployed.
    return 301 https://creasenyc.com$request_uri;
}
