# usecreaseapp.com — the customer site.
#
# Static marketing HTML until the site had to answer a question: "do you reach
# my street?". That answer needs the partner list and has to be recorded, so
# the vhost now proxies apps/web (Next, 127.0.0.1:3020) rather than serving
# files. /assets and /privacy.html still come off disk, because a stylesheet
# does not need a Node process.
#
# The cleaner portal, customer API, and carrier webhooks stay where they are
# (see nginx-app-domains.conf).
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc.

server {
    listen 80;
    listen [::]:80;
    server_name usecreaseapp.com www.usecreaseapp.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://usecreaseapp.com$request_uri; }
}

server {
    # nginx 1.24 on this droplet predates the standalone `http2 on;` directive
    # (1.25.1+) — keep the listen-parameter form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://usecreaseapp.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usecreaseapp.com;

    ssl_certificate     /etc/letsencrypt/live/usecreaseapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecreaseapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/usecreaseapp.access.log site;
    error_log  /var/log/nginx/usecreaseapp.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/usecreaseapp;

    # Marketing assets and the privacy page are files; serve them as files.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /privacy.html { try_files $uri =404; }

    # Every form on this site is a Next server action, which is a POST to the
    # page's own path — so the rate limit belongs on the whole app, not on some
    # /api prefix that does not exist. The coverage check geocodes and writes a
    # row, and both are things a script would enjoy doing ten thousand times.
    location / {
        limit_req zone=req_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
