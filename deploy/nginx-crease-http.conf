# Pre-TLS vhost for crease.divinedavis.com.
#
# Installed before the certificate exists so that the moment the DNS A record
# resolves, certbot's webroot challenge can be served. `deploy/enable-tls.sh`
# replaces this file with nginx-crease.conf once the cert is issued.
#
# Edit locally and scp; a quoted ssh heredoc mangles $host into a literal and
# nginx will 404 every route while `nginx -t` still passes.

server {
    listen 80;
    listen [::]:80;
    server_name crease.divinedavis.com;

    access_log /var/log/nginx/crease.access.log site;
    error_log  /var/log/nginx/crease.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Serve the app over plain HTTP until the cert exists, so the deploy can
    # be verified end to end before TLS is in the picture.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        access_log off;
    }
}
