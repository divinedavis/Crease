# creasenyc.com — the name Crease actually goes by.
#
# Additive, not a rename. usecreaseapp.com keeps working and always will:
# every TestFlight build from 28 onward has api.usecreaseapp.com compiled into
# it, and a phone in somebody's pocket cannot be redeployed. So the old names
# keep serving the same upstreams, the marketing site redirects to the new
# canonical one, and the API answers on both hosts forever.
#
# Its own file and its own certificate rather than expanding the existing one:
# an expand failure takes the live cert with it, and there is nothing to be
# gained by putting a working site at risk to save a file.
#
# Edit this file locally and scp it up; do NOT pipe it through an ssh heredoc.

server {
    listen 80;
    listen [::]:80;
    server_name creasenyc.com www.creasenyc.com api.creasenyc.com portal.creasenyc.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- www -> apex ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.creasenyc.com;

    ssl_certificate     /etc/letsencrypt/live/creasenyc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creasenyc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://creasenyc.com$request_uri;
}

# --- the customer site ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creasenyc.com;

    ssl_certificate     /etc/letsencrypt/live/creasenyc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creasenyc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/creasenyc.access.log site;
    error_log  /var/log/nginx/creasenyc.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No `root` and no file locations. Assets used to be served off
    # /var/www/usecreaseapp, which is the directory the old static site lived
    # in — so anything added to the app's own public/ folder 404'd while
    # looking perfectly deployed. The app owns its files; nginx just proxies.

    # Every form here is a Next server action posting to its own path, and the
    # coverage check geocodes and writes a row — both things a script would
    # enjoy doing ten thousand times.
    # Google Search Console ownership token, served by nginx rather than from
    # the app's public/ folder. Next bakes the list of public files at build
    # time, so a file dropped in afterwards 404s until the next build — and
    # this box cannot run `next build` without risking the five other sites on
    # it. Google re-checks this token periodically and un-verifies the property
    # if it stops answering, so it lives somewhere a deploy cannot remove.
    location = /googlef630845c68076fd4.html {
        default_type text/html;
        return 200 "google-site-verification: googlef630845c68076fd4.html";
    }

    location / {
        limit_req zone=req_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- customer + carrier API ----------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.creasenyc.com;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    ssl_certificate     /etc/letsencrypt/live/creasenyc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creasenyc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crease-api.access.log site;
    error_log  /var/log/nginx/crease-api.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 12m;

    # Carriers will not deliver callbacks to a private host. Auth is the HMAC
    # over the raw body — never rate-limit real events away.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # The app runs on a phone. Authenticated by the customer's own Supabase
    # token; every route re-checks ownership.
    location /v1/me/ {
        limit_req zone=req_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /public/canvass-stats {
        limit_req zone=req_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Internal dispatch API: only the portal, on this same host, ever calls it.
    location /v1/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        access_log off;
    }

    location / { return 404; }
}

# --- cleaner portal -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.creasenyc.com;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co https://api.creasenyc.com https://api.usecreaseapp.com; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    ssl_certificate     /etc/letsencrypt/live/creasenyc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creasenyc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crease-portal.access.log site;
    error_log  /var/log/nginx/crease-portal.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    # Canvassing tool, behind the same basic auth as on the old host.
    location ^~ /prospects {
        # No basic auth in front of it any more. It was here because the login
        # surface embedded a live session and had no reason to face the
        # internet — but the gate that actually protects the notes is RLS,
        # which scopes every row to one account, and the anon key it carries is
        # public in every app build already. A second password on a phone in
        # the street bought nothing and cost the canvasser a keyboard.
        alias /var/www/crease-prospects;
        index index.html;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        # Supabase writes the session as several large Set-Cookie headers, and
        # the OAuth callback writes all of them at once. nginx's default
        # proxy_buffer_size cannot hold that response's headers, so it drops the
        # upstream reply and returns 502 — a sign-in that worked, discarded on
        # the doorstep.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        # Overwrite, never pass through: a caller's own X-Forwarded-Host would
        # otherwise reach Next, where it drives redirect origins and the Server
        # Action CSRF check.
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://localhost:3010/  https://portal.creasenyc.com/;
        proxy_redirect https://localhost:3010/ https://portal.creasenyc.com/;
        proxy_redirect http://127.0.0.1:3010/  https://portal.creasenyc.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
